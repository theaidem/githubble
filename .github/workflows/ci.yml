name: CI

on:
  push:
    branches: [master, rewrite-modern]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Test with race detector
        run: go test -race -shuffle=on -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Check Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          working-directory: backend

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t githubble-backend:ci ./backend
      - run: docker build -t githubble-frontend:ci ./frontend
