name: CI

on:
  push:
    branches: [master, rewrite-modern]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a production deployment when another commit is pushed.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  go:
    name: Go tests and checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Test with race detector
        run: go test -race -shuffle=on -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Check Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          check-latest: true
          cache-dependency-path: backend/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t githubble-backend:ci ./backend
      - run: docker build -t githubble-frontend:ci ./frontend

  deploy:
    name: Deploy to server
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [go, go-lint, frontend, docker]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -eu
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "Missing deployment setting: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ || "$DEPLOY_PATH" == *..* || "$DEPLOY_PATH" == / ]]; then
            echo 'DEPLOY_PATH must be an absolute path without spaces or ..' >&2
            exit 1
          fi
          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/known_hosts"
      - name: Update checkout and restart services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/deploy-ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts")
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -se -- "$DEPLOY_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          deploy_path=$1
          sha=$2
          cd "$deploy_path"
          test -f .env || { echo "Missing $deploy_path/.env on server" >&2; exit 1; }
          git rev-parse --is-inside-work-tree >/dev/null
          docker compose version >/dev/null
          git fetch --prune origin
          git reset --hard "$sha"
          docker compose --project-name githubble --env-file .env -f docker-compose.yaml up -d --build --force-recreate --remove-orphans
          docker compose --project-name githubble --env-file .env -f docker-compose.yaml ps
          REMOTE

  pages-build:
    name: Build GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [go, go-lint, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build static export
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SSE_URL: ${{ vars.PAGES_SSE_URL || 'https://githubble.root.sx/api/events' }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          # Route handlers cannot be exported statically; the stream comes from the public deployment.
          rm -rf src/app/api
          npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out

  pages-deploy:
    name: Deploy to GitHub Pages
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Notify Telegram
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [go, go-lint, frontend, docker, deploy]
    runs-on: ubuntu-latest
    environment: production
    # A failed notification must not change the outcome of the pipeline.
    continue-on-error: true
    steps:
      - name: Send message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ vars.TELEGRAM_THREAD_ID }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram settings are missing, notification skipped" >&2
            exit 0
          fi
          case "$DEPLOY_RESULT" in
            success) status='✅ Deployed' ;;
            skipped) status='❌ Checks failed, not deployed' ;;
            *) status='❌ Deploy failed' ;;
          esac
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          text=$(printf '%s githubble %s\n%s\n%s' "$status" "${GITHUB_SHA::7}" "$subject" "$RUN_URL")
          args=(--data-urlencode "chat_id=$CHAT_ID" --data-urlencode "text=$text" --data-urlencode "disable_web_page_preview=true")
          if [ -n "$THREAD_ID" ]; then
            args+=(--data-urlencode "message_thread_id=$THREAD_ID")
          fi
          curl -fsS "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" "${args[@]}" > /dev/null
